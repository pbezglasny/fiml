[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "fiml"
description = "Python bindings for the fiml indicator engine (runs the exact Rust feature extractor)."
readme = "README.md"
license = { text = "Apache-2.0" }
maintainers = [{ name = "Pavel Bezglasnyy", email = "pavelb23@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["numpy>=1.21"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/pbezglasny/fiml"
Repository = "https://github.com/pbezglasny/fiml"
Issues = "https://github.com/pbezglasny/fiml/issues"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
sklearn = ["scikit-learn>=1.9,<1.10"]
test = ["pandas>=2.0", "pytest>=8.0", "jsonschema>=4.0", "scikit-learn>=1.9,<1.10"]

[tool.maturin]
# Mixed layout: the compiled module is `fiml._fiml`, re-exported by the pure
# Python package in `python/fiml/__init__.py`.
python-source = "python"
module-name = "fiml._fiml"
features = ["pyo3/extension-module"]
