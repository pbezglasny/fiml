name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Match tag and package versions
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if match is None:
              raise SystemExit(f"release tag must match vX.Y.Z, got {tag!r}")

          version = match.group(1)
          for path in ("crates/fiml/Cargo.toml", "crates/fiml-python/Cargo.toml"):
              with open(path, "rb") as manifest_file:
                  package_version = tomllib.load(manifest_file)["package"]["version"]
              if package_version != version:
                  raise SystemExit(
                      f"{path} has version {package_version}, expected {version} from {tag}"
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
          PY

  crate:
    name: Build Rust crate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Package and verify crate
        run: cargo package -p fiml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-crate
          path: target/package/fiml-${{ needs.validate.outputs.version }}.crate
          if-no-files-found: error

  wheels:
    name: Build wheel (${{ matrix.platform.artifact }})
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: "2_17"
            artifact: linux-x86_64
            test: true
          - runner: ubuntu-latest
            target: aarch64
            manylinux: "2_17"
            artifact: linux-aarch64
            test: false
          - runner: macos-15-intel
            target: x86_64
            manylinux: auto
            artifact: macos-x86_64
            test: false
          - runner: macos-15
            target: aarch64
            manylinux: auto
            artifact: macos-aarch64
            test: false
          - runner: windows-latest
            target: x64
            manylinux: auto
            artifact: windows-x86_64
            test: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          rust-toolchain: 1.89.0
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist --manifest-path crates/fiml-python/Cargo.toml
          sccache: true
      - name: Install wheel and test Python API
        if: matrix.platform.test
        shell: bash
        run: |
          python -m pip install dist/*.whl "pandas>=2.0" "pytest>=8.0" \
            "jsonschema>=4.0" "scikit-learn>=1.9,<1.10"
          python -m pytest crates/fiml-python/tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-${{ matrix.platform.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build Python sdist
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path crates/fiml-python/Cargo.toml
          maturin-version: v1.14.1
          rust-toolchain: 1.89.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [validate, crate, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fiml
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sdist
          path: dist
      - name: Publish Python distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    name: Publish GitHub Release
    needs: [validate, crate, wheels, sdist, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 7
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 5
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test -f "dist/fiml-${{ needs.validate.outputs.version }}.crate"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: docs/releases/v${{ needs.validate.outputs.version }}.md
